name: Public research footprint
on:
  push:
    paths: [index.js, tests/public-research-footprint.test.cjs, .github/workflows/public-research-footprint.yml]
  pull_request:
    paths: [index.js, tests/public-research-footprint.test.cjs, .github/workflows/public-research-footprint.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check index.js
      - name: Contract — self-reported metrics reach the public site, gated and dated
        run: node --test tests/public-research-footprint.test.cjs
