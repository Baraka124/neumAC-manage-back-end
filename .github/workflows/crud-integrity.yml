name: CRUD integrity
on:
  pull_request:
    paths:
      - index.js
      - decision51.js
      - tests/crud-integrity.test.cjs
      - tests/rotation-overlap-parity.test.cjs
      - .github/workflows/crud-integrity.yml
  push:
    branches: [main]
    paths:
      - index.js
      - decision51.js
      - tests/crud-integrity.test.cjs
jobs:
  crud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check index.js
      - name: CRUD integrity guards
        run: node --test tests/crud-integrity.test.cjs
      - name: Rotation overlap rule matches the database
        run: node --test tests/rotation-overlap-parity.test.cjs
