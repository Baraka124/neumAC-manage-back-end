name: Lifecycle reconciliation
on:
  push:
    paths: [index.js, tests/lifecycle-reconciliation.test.cjs, .github/workflows/lifecycle-reconciliation.yml]
  pull_request:
    paths: [index.js, tests/lifecycle-reconciliation.test.cjs, .github/workflows/lifecycle-reconciliation.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check index.js
      - name: Contract — finished/drifted records never masquerade as live
        run: node --test tests/lifecycle-reconciliation.test.cjs
