name: Ops Room
on:
  pull_request:
    paths: [index.js, ops-room.js, portfolio.js, tests/ops-room.test.cjs, tests/ops-room-or2.test.cjs, tests/ops-room-or3.test.cjs, tests/ops-room-orc.test.cjs, migrations/**, .github/workflows/ops-room.yml]
  push:
    branches: [main]
    paths: [index.js, ops-room.js, tests/ops-room.test.cjs]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check index.js && node --check ops-room.js
      - name: Ops Room rules and guards
        run: node --test tests/ops-room.test.cjs tests/ops-room-or2.test.cjs tests/ops-room-or3.test.cjs tests/ops-room-orc.test.cjs tests/ops-room-orr.test.cjs
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Server boots (all routes register)
        run: node tests/boot-smoke.cjs
