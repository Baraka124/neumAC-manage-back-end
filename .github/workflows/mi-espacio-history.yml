name: Mi Espacio historical research
on:
  pull_request:
    paths: [index.js, mi-espacio-research-history.js, tests/mi-espacio-research-history.test.cjs, .github/workflows/mi-espacio-history.yml]
  push:
    branches: [main]
    paths: [index.js, mi-espacio-research-history.js, tests/mi-espacio-research-history.test.cjs]
jobs:
  historical-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node --check index.js
          node --check mi-espacio-research-history.js
          node --test tests/mi-espacio-research-history.test.cjs
